# Runs everything (app + Postgres):
#   docker compose up --build
# then open http://localhost:8080. Optional: export ANTHROPIC_API_KEY and/or GITHUB_TOKEN first.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://scans:scans@postgres:5432/scans
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scans
      POSTGRES_PASSWORD: scans
      POSTGRES_DB: scans
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scans"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
